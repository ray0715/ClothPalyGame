const DATA={"I": {"wx": ["又悶又濕，一動就滿身大汗。", "寒流來襲，冷風一直往衣服裡灌。", "豔陽高照，熱到快要融化了。", "天氣舒適，溫度剛剛好。"], "ans": ["吸濕排汗", "重磅棉", "涼感", "一般棉"], "hide": 3, "ch": "火"}, "II": {"wx": ["寒流來襲，冷風一直往衣服裡灌。", "天氣舒適，溫度剛剛好。", "又悶又濕，一動就滿身大汗。", "豔陽高照，熱到快要融化了。"], "ans": ["重磅棉", "一般棉", "吸濕排汗", "涼感"], "hide": 0, "ch": "門"}, "III": {"wx": ["豔陽高照，熱到快要融化了。", "又悶又濕，一動就滿身大汗。", "天氣舒適，溫度剛剛好。", "寒流來襲，冷風一直往衣服裡灌。"], "ans": ["涼感", "吸濕排汗", "一般棉", "重磅棉"], "hide": 1, "ch": "家"}, "IV": {"wx": ["天氣舒適，溫度剛剛好。", "豔陽高照，熱到快要融化了。", "寒流來襲，冷風一直往衣服裡灌。", "又悶又濕，一動就滿身大汗。"], "ans": ["一般棉", "涼感", "重磅棉", "吸濕排汗"], "hide": 2, "ch": "鎖"}, "V": {"wx": ["寒流來襲，冷風一直往衣服裡灌。", "又悶又濕，一動就滿身大汗。", "天氣舒適，溫度剛剛好。", "豔陽高照，熱到快要融化了。"], "ans": ["重磅棉", "吸濕排汗", "一般棉", "涼感"], "hide": 3, "ch": "會"}};const ORDER=['I','II','III','IV','V'];const T2D=[0,3,1,4,2,0,3,1,4,2];
let team=-1,done=[false,false,false,false],picks=[null,null,null,null],deadline=0,timer=null,finished=false;
const $=id=>document.getElementById(id);
function lockTeam(){const m=/^#team-(\d{2})$/.exec(location.hash);return m&&+m[1]>=1&&+m[1]<=10?+m[1]:0;}
function buildTeams(){const t=lockTeam();
 if(t){$('teams').innerHTML=`<button class="team" data-team="${t-1}">第 ${String(t).padStart(2,'0')} 隊・開始任務</button>`;document.querySelector('.startbar').textContent='🧭 你們的專屬任務｜MISSION START';document.querySelector('.brand').textContent=`第 ${String(t).padStart(2,'0')} 隊｜漂流日記`;$('back').style.display='none';}
 else{$('teams').innerHTML=Array.from({length:10},(_,i)=>`<button class="team" data-team="${i}">第 ${i+1} 隊</button>`).join('');$('back').style.display='';}}
buildTeams();window.addEventListener('hashchange',()=>{buildTeams();back();});
$('teams').addEventListener('click',e=>{const b=e.target.closest('[data-team]');if(b)start(+b.dataset.team);});
const P=()=>DATA[ORDER[team]];
function start(n){team=T2D[n];done=[false,false,false,false];picks=[null,null,null,null];queue=[];finished=false;
 $('intro').style.display='none';$('game').style.display='block';$('teamlabel').textContent=`第 ${n+1} 隊 · 專屬任務`;
 $('lands').innerHTML=MEM.map((m,i)=>i===P().hide?`<div class="land hide"><b>${m.land}</b><span>天氣預報被海水泡爛了，看不清楚……</span></div>`:`<div class="land"><b>${m.land}</b><span>${P().wx[i]}</span></div>`).join('');
 deadline=Date.now()+180000;clearInterval(timer);timer=setInterval(tick,500);tick();render();$('feedback').textContent='按「＋ 穿上衣服」幫每位社員選材質，全部選好後按「確認穿搭」。';window.scrollTo({top:0});}
function tick(){const r=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('clock').textContent=`${String(Math.floor(r/60)).padStart(2,'0')}:${String(r%60).padStart(2,'0')}`;$('clock').classList.toggle('low',r<=30);if(!r){clearInterval(timer);if(!finished)$('feedback').textContent='時間到！你仍可以繼續完成挑戰。';}}
let cur=-1,queue=[];
function render(){
 $('members').innerHTML=MEM.map((m,i)=>`<div class="member"><img src="${IMG[m.id]}" alt="${m.name}"><b>${m.name}<span class="en">${m.en}</span></b><small>${m.title}<br>${m.club}</small><span class="home">要回 ${m.land}</span>
 <button class="slot ${picks[i]?'filled':''}" data-m="${i}" ${finished?'disabled':''}>${picks[i]?picks[i]+'（點我更換）':'＋ 穿上衣服'}</button></div>`).join('');}
$('members').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b||finished)return;openPicker(+b.dataset.m);});
function openPicker(i){cur=i;$('ptitle').textContent=`幫 ${MEM[i].name} ${MEM[i].en} 選衣服`;
 $('plist').innerHTML=FAB.map(f=>{const who=picks.findIndex((v,k)=>v===f&&k!==i);
   return who>=0?`<button disabled>${f}<small>已被 ${MEM[who].name} 穿走</small></button>`:`<button data-f="${f}" class="${picks[i]===f?'cur':''}">${f}</button>`;}).join('')
   +(picks[i]?`<button class="off" data-f="">取下衣服</button>`:'');
 $('picker').classList.add('show');}
$('plist').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;picks[cur]=b.dataset.f||null;$('picker').classList.remove('show');render();
 $('feedback').textContent=picks.every(Boolean)?'四位都穿好了，按「確認穿搭」看看吧！':'繼續幫其他社員挑選。';});
$('pcancel').addEventListener('click',()=>$('picker').classList.remove('show'));
$('check').addEventListener('click',()=>{if(finished)return;if(picks.some(x=>!x)){$('feedback').textContent='還有社員沒穿上衣服！';return;}
 queue=picks.map((f,i)=>f!==P().ans[i]?i:-1).filter(i=>i>=0);
 if(!queue.length){finished=true;clearInterval(timer);render();show(IMG.ok,'上課有認真聽喔！','good',P().ch);$('feedback').textContent='四位社員都平安回家了！';}
 else{$('feedback').textContent=`有 ${queue.length} 位社員穿錯了，再看看各國的天氣預報。`;nextWrong();}});
function nextWrong(){const i=queue.shift();show(IMG[MEM[i].id+'_e'],`${MEM[i].name}：你選錯了！`,'bad','');$('mclose').textContent=queue.length?'下一位':'再試一次';}
$('reset').addEventListener('click',()=>{if(finished)return;picks=[null,null,null,null];$('feedback').textContent='已全部取消，所有衣服都脫下來了，重新幫大家選吧！';render();});
function show(src,t,cls,ans){$('mimg').src=src;$('mtitle').textContent=t;$('mtitle').className=cls;$('mans').textContent=ans?`暗號 ⑥　${ans}`:'';$('mans').style.display=ans?'block':'none';$('mclose').textContent=ans?'太好了':'再試一次';$('modal').classList.add('show');}
$('mclose').addEventListener('click',()=>{$('modal').classList.remove('show');if(queue.length)setTimeout(nextWrong,150);});
function back(){clearInterval(timer);$('game').style.display='none';$('intro').style.display='block';}
